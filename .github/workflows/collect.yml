name: collect
on:
  schedule:
    # 분을 0으로 두지 않는다. 정시는 부하가 몰려 지연되거나 건너뛴다.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run collect
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      - name: commit
        run: |
          git config user.name "collector"
          git config user.email "collector@users.noreply.github.com"
          git add public/data/feed.json cache/
          git diff --quiet --cached || git commit -m "data: $(date -u +%FT%TZ)"
          git push
